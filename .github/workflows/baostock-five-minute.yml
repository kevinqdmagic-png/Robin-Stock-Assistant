name: BaoStock five-minute independent collection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-five-minute.yml'
  workflow_dispatch:
    inputs:
      research_day:
        description: 'Completed A-share trading day YYYY-MM-DD'
        required: true
        default: '2026-11-04'
  schedule:
    - cron: '15 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: baostock-five-minute-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'baostock>=0.8.9,<0.9'
      - name: Run five-minute parser unit tests
        run: PYTHONPATH=backend python -m unittest backend/test_baostock_five_minute.py backend/test_baostock_session.py
      - name: Fetch verified five-minute bars
        env:
          RESEARCH_DAY: ${{ inputs.research_day || '' }}
        run: |
          set -euo pipefail
          if [ -z "$RESEARCH_DAY" ]; then
            RESEARCH_DAY=$(PYTHONPATH=backend python -c 'from collect_baostock_five_minute import default_research_day; print(default_research_day())')
          fi
          export RESEARCH_DAY
          echo "BAOSTOCK_COLLECT_START date=$RESEARCH_DAY source=baostock"
          PYTHONPATH=backend python backend/collect_baostock_five_minute.py
          echo "BAOSTOCK_COLLECT_VALIDATED date=$RESEARCH_DAY"
      - name: Summarize failed collection
        if: failure()
        run: |
          echo "### BaoStock 5-minute collection failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No unverified bars were published. Inspect Fetch verified five-minute bars logs." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit collected history only on success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/baostock_five_minute/
          if ! git diff --cached --quiet; then
            git commit -m "data: verified BaoStock five-minute historical snapshot"
            git push
          fi
