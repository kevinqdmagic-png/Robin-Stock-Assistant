name: Intraday research and auditable result
on:
  schedule:
    # GitHub cron uses UTC. Beijing 09:50 / 14:40 (UTC+8).
    - cron: '50 1 * * 1-5'
    - cron: '40 6 * * 1-5'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Research window'
        type: choice
        required: true
        options:
          - early_pair
          - late_pair
permissions:
  contents: write
concurrency:
  # Two slots share a single append-only receipt ledger; never race writes.
  group: scheduled-task-ledger-writer
  cancel-in-progress: false
jobs:
  evidence-and-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quote HTTP client
        run: python -m pip install requests
      - name: Collect timestamped public-market observations
        run: python scripts/collect_intraday_feed.py --output intraday_feed.json
      - name: Evaluate market readiness, without fabricated picks
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ "$SCHEDULE" = "50 1 * * 1-5" ]; then SLOT=early_pair
          elif [ "$SCHEDULE" = "40 6 * * 1-5" ]; then SLOT=late_pair
          else SLOT="$INPUT_SLOT"; fi
          python scripts/run_intraday_research.py --slot "$SLOT" --feed-file intraday_feed.json --output intraday_outcome.json
      - name: Publish explicitly non-actionable observations
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGINAL_RESEARCH_BLOB=$(git rev-parse HEAD:backend/data/research.json)
          python scripts/publish_intraday_observation.py --outcome intraday_outcome.json --run-id "$GH_RUN_ID"
          if grep -q 'observation_report_id' intraday_outcome.json; then
            python scripts/safe_github_update.py \
              "${{ github.repository }}" \
              backend/data/research.json backend/data/research.json \
              --base-sha "$ORIGINAL_RESEARCH_BLOB" \
              --message "data: archive non-actionable intraday observation"
          fi
      - name: Append verified, honest task status to the APP ledger
        id: record
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGINAL_BLOB=$(git rev-parse HEAD:backend/data/task_runs.json)
          python scripts/publish_intraday_outcome.py --outcome intraday_outcome.json --run-id "$GH_RUN_ID"
          python scripts/safe_github_update.py \
            "${{ github.repository }}" \
            backend/data/task_runs.json backend/data/task_runs.json \
            --base-sha "$ORIGINAL_BLOB" \
            --message "ops: publish audited intraday task outcome"
      - name: Upload evidence even when subsequent steps fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-evidence-${{ github.run_id }}
          path: |
            intraday_feed.json
            intraday_outcome.json
            intraday_publish_status.json
          retention-days: 90
      - name: Fail the workflow when stock research was not completed
        if: steps.record.outcome == 'success'
        run: |
          python -c 'import json,sys; result=json.load(open("intraday_outcome.json")); sys.exit(0 if result["status"] == "skipped" and result.get("reason") == "not_a_verified_trading_session" else 1)'
