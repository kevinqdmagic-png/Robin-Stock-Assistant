name: Research correctness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: T+1, future-data, price limits, archive and API checks
        run: python -m unittest discover -s backend/tests -v
      - name: Freeze published history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_archives.py "$BASE_SHA"
      - name: Build the packaged backend
        run: docker build -t robin-stock-api:ci backend
      - name: Verify the running container and packaged archives
        run: |
          docker run -d --name robin-api -p 18080:8080 -e PORT=8080 robin-stock-api:ci
          python scripts/verify_production.py --base http://127.0.0.1:18080 --wait 40
  production:
    if: github.event_name == 'push'
    needs: research
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify published task center and reports
        run: python scripts/verify_production.py --wait 600
