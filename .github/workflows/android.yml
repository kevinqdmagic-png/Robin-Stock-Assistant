name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Robin-Stock-Assistant-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the versioned test APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          APK_TAG="v$APK_VERSION"
          APK_FILE="Robin-Stock-Assistant-$APK_VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          if gh release view "$APK_TAG" >/dev/null 2>&1; then
            echo "Version $APK_VERSION is already published"
          else
            gh release create "$APK_TAG" "$APK_FILE" --title "Robin 股票助手 $APK_VERSION 测试版" --notes-file docs/apk-release-notes.md --target "$GITHUB_SHA"
          fi
