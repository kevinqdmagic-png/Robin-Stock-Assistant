name: Daily accumulation-shape watch (non-actionable)
on:
  schedule:
    # Beijing 18:10 on weekdays, may start late with GitHub Actions scheduling.
    - cron: '10 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capital-watch-archive-writer
  cancel-in-progress: false
jobs:
  screen-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Scan verified completed daily bars and record actual outcome
        id: scan
        continue-on-error: true
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          ORIGINAL_BLOB=$(git rev-parse HEAD:backend/data/capital_watch.json)
          echo "original_blob=$ORIGINAL_BLOB" >> "$GITHUB_OUTPUT"
          python scripts/run_daily_capital_watch.py --run-id "$GH_RUN_ID" --result capital_watch_status.json
      - name: Publish immutable result into APP archive
        if: always() && steps.scan.outcome != 'skipped'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f capital_watch_status.json ]; then
            echo "Missing execution evidence; refusing to publish" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          outcome=json.load(open("capital_watch_status.json"))
          open("changed.flag","w").write("yes" if outcome["changed"] else "no")
          PY
          if [ "$(cat changed.flag)" = "yes" ]; then
            python scripts/safe_github_update.py \
              "${{ github.repository }}" \
              backend/data/capital_watch.json backend/data/capital_watch.json \
              --base-sha "${{ steps.scan.outputs.original_blob }}" \
              --message "data: append daily accumulation-shape research candidates"
          fi
      - name: Retain run evidence even after upstream outages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capital-watch-evidence-${{ github.run_id }}
          path: capital_watch_status.json
          retention-days: 90
      - name: Fail visibly when market evidence is insufficient
        if: always()
        run: |
          python - <<'PY'
          import json,sys
          data=json.load(open("capital_watch_status.json"))
          sys.exit(0 if data["status"] in ("completed","no_matches","skipped") else 1)
          PY
