name: Publish linked research bundle
on:
  push:
    branches: [main]
    paths:
      - 'research_backfills/linked-*.json'
      - '.github/workflows/publish-research-bundle.yml'
      - 'scripts/verify_linked_bundle.py'
  workflow_dispatch:
    inputs:
      bundle:
        description: Repository path of an append-only linked research bundle
        required: true
permissions:
  contents: write
concurrency:
  group: linked-research-bundles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and publish immutable linked records
        env:
          SELECTED_BUNDLE: ${{ inputs.bundle }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import os, pathlib, subprocess
          base = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          selected = os.environ.get('SELECTED_BUNDLE')
          if selected:
              paths = [selected]
          else:
              paths = sorted(str(p) for p in pathlib.Path('research_backfills').glob('linked-*.json'))
          for path in paths:
              resolved = pathlib.Path(path).resolve()
              if resolved.parent != pathlib.Path('research_backfills').resolve() or not resolved.is_file():
                  raise SystemExit('invalid bundle path')
              subprocess.run(['python','scripts/publish_linked_archives.py','--base',base,
                              '--bundle',path], check=True)
          PY
      # A GITHUB_TOKEN push does not start another correctness workflow. Check
      # the actual merged commit here, including concurrent append-only writers.
      - name: Check out the published archive commit
        run: |
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/robin-published" FETCH_HEAD
          echo "PUBLISHED_ROOT=$RUNNER_TEMP/robin-published" >> "$GITHUB_ENV"
          echo "PUBLISHED_SHA=$(git -C "$RUNNER_TEMP/robin-published" rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pip install -r backend/requirements.txt
        working-directory: ${{ env.PUBLISHED_ROOT }}
      - name: Regressions on the published commit
        working-directory: ${{ env.PUBLISHED_ROOT }}
        run: python -m unittest discover -s backend/tests -v
      - name: Verify archives after publication
        working-directory: ${{ env.PUBLISHED_ROOT }}
        run: python scripts/validate_archives.py HEAD^
      - name: Build and verify the published container
        working-directory: ${{ env.PUBLISHED_ROOT }}
        run: |
          docker build -t robin-stock-api:linked backend
          docker run -d --name robin-linked-api -p 18080:8080 -e PORT=8080 robin-stock-api:linked
          python scripts/verify_production.py --base http://127.0.0.1:18080 --wait 40
      - name: Verify actual deployed report bodies and receipts
        working-directory: ${{ env.PUBLISHED_ROOT }}
        run: python scripts/verify_linked_bundle.py --wait 420 --expected-sha "$PUBLISHED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linked-publication-evidence
          path: |
            linked-publication.json
            ${{ env.PUBLISHED_ROOT }}/bundle-readback.json
          retention-days: 90
