name: Daily validated BaoStock Shanghai Shenzhen close
on:
  workflow_dispatch:
    inputs:
      research_day:
        description: 'Completed trading day; blank uses the verified exchange calendar'
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-daily.yml'
      - 'scripts/collect_baostock_bulk.py'
  schedule:
    # Allow publication time, then retry at 20:00 Beijing. Already verified dates skip network.
    - cron: '0 10,12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: baostock-source-access
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'baostock==0.9.3'
      - name: Resolve completed session without depending on provider availability
        env:
          RESEARCH_DAY: ${{ inputs.research_day || '' }}
        run: |
          if [ -z "$RESEARCH_DAY" ]; then
            RESEARCH_DAY=$(PYTHONPATH=backend python -c 'from collect_baostock_five_minute import default_research_day; print(default_research_day())')
          fi
          echo "RESEARCH_DAY=$RESEARCH_DAY" >> "$GITHUB_ENV"
      - name: Single-connection market-wide request, one bounded retry
        id: collect
        run: |
          set +e
          timeout 120s env PYTHONPATH=backend python scripts/collect_baostock_bulk.py --date "$RESEARCH_DAY"
          code=$?
          if [ "$code" -ne 0 ]; then
            # A blacklist response requires cooldown, never another immediate login.
            if ! grep -q '10001011' backend/data/market_source_status/baostock-"$RESEARCH_DAY".json; then
              sleep 30
              timeout 120s env PYTHONPATH=backend python scripts/collect_baostock_bulk.py --date "$RESEARCH_DAY"
              code=$?
            fi
          fi
          if [ ! -f backend/data/market_source_status/baostock-"$RESEARCH_DAY".json ]; then
            mkdir -p backend/data/market_source_status
            python -c 'import json,os,pathlib; day=os.environ["RESEARCH_DAY"]; pathlib.Path("backend/data/market_source_status/baostock-"+day+".json").write_text(json.dumps({"provider":"baostock","trade_date":day,"ok":False,"status":"timeout_no_result"})+"\n")'
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish operational status and only validated new history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/market_source_status/ backend/data/baostock/
          if ! git diff --cached --quiet; then
            git commit -m "data: BaoStock single-connection collection status for $RESEARCH_DAY"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baostock-single-connection-status
          path: backend/data/market_source_status/
          retention-days: 30
      - name: Preserve source failure as failure
        if: steps.collect.outputs.exit_code != '0'
        run: exit 1
