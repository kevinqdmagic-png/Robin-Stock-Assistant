name: Free BaoStock source health (diagnostic only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_baostock.py'
      - '.github/workflows/baostock-health.yml'
  schedule:
    # 17:30 Beijing (09:30 UTC), Monday-Friday. Holiday/no-bar is not an outage.
    - cron: '30 9 * * 1-5'

permissions:
  contents: read

jobs:
  baostock-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free BaoStock package
        run: python -m pip install --disable-pip-version-check 'baostock==0.9.3'
      - name: Probe connection and historical OHLCV (bounded)
        shell: bash
        run: |
          set +e
          timeout 60s python scripts/probe_baostock.py > baostock-probe.log 2>&1
          code=$?
          PROBE_EXIT_CODE="$code" python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = Path("baostock-probe.log").read_text(errors="replace")
          payload = None
          for line in reversed(raw.splitlines()):
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict) and candidate.get("provider") == "baostock":
                  payload = candidate
                  break
          if payload is None:
              payload = {
                  "ok": False,
                  "provider": "baostock",
                  "status": "timeout" if os.environ["PROBE_EXIT_CODE"] == "124" else "no_structured_result",
                  "probe_exit_code": int(os.environ["PROBE_EXIT_CODE"]),
                  "error_excerpt": raw[-600:],
              }
          Path("baostock-probe.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n"
          )
          PY
          echo "probe_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          cat baostock-probe.json >> "$GITHUB_STEP_SUMMARY"
          echo "::group::BAOSTOCK_DIAGNOSTIC_RESULT"
          cat baostock-probe.json
          echo "----- RAW PROVIDER LOG (last 60 lines) -----"
          tail -n 60 baostock-probe.log
          echo "::endgroup::"
          if [ "$code" -ne 0 ]; then
            status=$(python -c 'import json; print(json.load(open("baostock-probe.json")).get("status", "unknown"))')
            echo "::error title=BaoStock probe failed::exit=$code status=$status; expand BAOSTOCK_DIAGNOSTIC_RESULT for details"
          fi
          # Nonzero exit preserves failure, while JSON and raw logs remain available.
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baostock-source-health
          path: |
            baostock-probe.json
            baostock-probe.log
          retention-days: 14
