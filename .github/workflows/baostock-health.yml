name: Free BaoStock source health (diagnostic only)

on:
  workflow_dispatch:
  schedule:
    # 17:30 Beijing (09:30 UTC), Monday-Friday. Holiday/no-bar is not an outage.
    - cron: '30 9 * * 1-5'

permissions:
  contents: read

jobs:
  baostock-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free BaoStock package
        run: python -m pip install --disable-pip-version-check 'baostock==0.9.3'
      - name: Probe connection and historical OHLCV (bounded)
        shell: bash
        run: |
          set +e
          timeout 60s python scripts/probe_baostock.py > baostock-probe.json 2>&1
          code=$?
          echo "probe_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          cat baostock-probe.json >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 124 ]; then echo '{"ok":false,"status":"timeout","timeout_seconds":60}' >> baostock-probe.json; fi
          # Red check means probe failed; artifact is still uploaded by always().
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baostock-source-health
          path: baostock-probe.json
          retention-days: 14
